<!DOCTYPE html>
<html lang="id">
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Library Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WebGIS Seismik 3 Blok - Supabase Cloud</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

#map { height: 100vh; width: 100vw; background: #222; position: relative; }

/* Perbaikan Layout Atas untuk Mobile */
.top-controls-container {
  position: absolute; top: 10px; left: 55px; right: 60px; z-index: 1000;
  display: flex; gap: 6px; align-items: center; justify-content: space-between;
}

.block-selector-box {
  background: #ffffff; padding: 4px 6px; border-radius: 8px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3); font-size: 10px; font-weight: bold;
  white-space: nowrap; flex-shrink: 0;
}
.block-selector-box select {
  padding: 3px; font-weight: bold; border-radius: 4px; border: 1px solid #007bff; color: #007bff; font-size: 10px;
}

.search-box {
  background: #ffffff; flex-grow: 1; max-width: 180px;
  padding: 2px; border-radius: 20px; box-shadow: 0 3px 8px rgba(0,0,0,0.3);
}
.search-box input {
  width: 100%; padding: 5px 8px; border: none; border-radius: 20px;
  text-align: center; font-weight: bold; font-size: 10px; outline: none;
}

.action-buttons-group {
  position: absolute; top: 60px; right: 10px; display: flex; flex-direction: column;
  gap: 6px; z-index: 1000;
}
.btn-action {
  background: #28a745; color: #ffffff; padding: 6px 10px; border-radius: 16px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.4); font-size: 10px; font-weight: bold; cursor: pointer;
  border: none; outline: none; transition: 0.2s; white-space: nowrap;
}
.btn-action:active { transform: scale(0.95); }
.btn-export { background: #007bff; }
.btn-admin { background: #dc3545; }
.btn-dash { background: #6f42c1; }
.btn-upload { background: #ffc107; color: #333; }

#coord-info {
  position: absolute; bottom: 45px; right: 10px;
  background: rgba(0, 0, 0, 0.85); color: #ffffff; padding: 5px 8px;
  border-radius: 10px; font-size: 9px; font-family: monospace; z-index: 1000;
  box-shadow: 0 3px 6px rgba(0,0,0,0.4); text-align: right; pointer-events: none;
}

.point-name-label { font-size: 9px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; white-space: nowrap; pointer-events: none; }

.modal-page {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: #f8f9fa; z-index: 99999; flex-direction: column; overflow-y: auto; font-family: sans-serif;
}
.modal-header {
  background: #343a40; color: #fff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
}
.modal-header h2 { font-size: 13px; margin: 0; }
.btn-close { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
.modal-body { padding: 15px; max-width: 1200px; margin: 0 auto; width: 100%; }

.stats-summary-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 10px; margin-bottom: 15px; }
@media(min-width: 600px) { .stats-summary-grid { grid-template-columns: repeat(2, 1fr); } }
.stat-card { background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border-left: 5px solid #007bff; }
.stat-card h4 { margin: 0 0 5px 0; font-size: 11px; color: #666; text-transform: uppercase; }
.stat-card .value { font-size: 16px; font-weight: bold; color: #333; }
.chart-container { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: relative; height: 280px; }
.form-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
</style>
</head>
<body>

<div id="map">
  <div class="top-controls-container">
    <div class="block-selector-box">
      <select id="mainSelectBlock">
        <option value="East_Block">East</option>
        <option value="Central_Block">Central</option>
        <option value="West_Block">West</option>
        <option value="ALL" selected>Semua Blok</option>
      </select>
    </div>
    
    <div class="search-box">
      <input id="searchBox" type="text" placeholder="🔍 Cari ID...">
    </div>
  </div>
  
  <div class="action-buttons-group">
    <button class="btn-action btn-dash" id="btn-open-dashboard">📊 Dashboard</button>
    <button class="btn-action btn-upload" id="btn-open-upload">📂 Upload</button>
    <button class="btn-action btn-admin" id="btn-open-admin">🔐 Admin</button>
    <button class="btn-action btn-export" id="btn-export-geojson">💾 Export</button>
  </div>

  <div id="coord-info">Lat: -, Lon: -</div>
</div>

<!-- DASHBOARD MODAL -->
<div id="dashboard-page" class="modal-page">
  <div class="modal-header">
    <h2>📊 Dashboard Progress Seismik</h2>
    <button id="btn-close-dashboard" class="btn-close">✕ Tutup</button>
  </div>
  <div class="modal-body">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="background:#fff; padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; font-size: 12px;">
        <b>Blok Ditinjau:</b>
        <select id="dashboardSelectBlock" style="padding:5px; font-weight:bold; border-radius:4px; border:1px solid #007bff; color:#007bff; font-size: 12px;">
          <option value="East_Block">East_Block</option>
          <option value="Central_Block">Central_Block</option>
          <option value="West_Block">West_Block</option>
          <option value="ALL" selected>Semua Blok</option>
        </select>
      </div>
      <div class="stats-summary-grid" id="modal-stats-summary"></div>
      <div class="chart-container">
        <canvas id="progressChart"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- UPLOAD PROGRESS MODAL -->
<div id="upload-page" class="modal-page">
  <div class="modal-header" style="background: #e0a800; color: #212529;">
    <h2>📂 Upload File Progress Harian</h2>
    <button id="btn-close-upload" class="btn-close" style="background:#343a40;">✕ Tutup</button>
  </div>
  <div class="modal-body">
    <div class="form-card" style="border-left: 6px solid #ffc107;">
      <h3 style="margin-top: 0; font-size: 13px; color: #333;">📄 Format File (.txt / .csv)</h3>
      <p style="font-size: 10px; color: #666; line-height: 1.4; margin-bottom: 12px;">
        Urutan: <code style="background:#eee; padding:2px 4px;">Tanggal, Kru, Line, Dari_SP, Sampai_SP, Status</code>
      </p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <select id="uploadTargetBlock" style="padding: 8px; font-weight: bold; border-radius: 4px; border: 1px solid #ccc; font-size: 11px;">
          <option value="East_Block">East_Block</option>
          <option value="Central_Block" selected>Central_Block</option>
          <option value="West_Block">West_Block</option>
          <option value="ALL">Semua Blok</option>
        </select>
        <input type="file" id="fileReportInput" accept=".txt,.csv" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; background: #fafafa;">
        <button id="btnExecuteUploadFile" style="background: #ffc107; color: #212529; border: none; padding: 9px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 11px;">🚀 Proses & Sync Supabase</button>
      </div>
    </div>
  </div>
</div>

<!-- ADMIN MODAL -->
<div id="admin-page" class="modal-page">
  <div class="modal-header" style="background: #dc3545;">
    <h2>🔐 Panel Administrator</h2>
    <button id="btn-close-admin" class="btn-close">✕ Tutup</button>
  </div>
  <div class="modal-body">
    <div class="form-card" style="border-left: 6px solid #007bff;">
      <h3 style="margin-top: 0; font-size: 13px; color: #333;">📦 1. Input Massal (Range TR)</h3>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
        <select id="adminRangeTargetBlock" style="padding: 7px; font-weight: bold; border-radius: 4px; border: 1px solid #ccc; font-size: 11px;">
          <option value="East_Block">East_Block</option>
          <option value="Central_Block" selected>Central_Block</option>
          <option value="West_Block">West_Block</option>
        </select>
        <input type="text" id="adminRangeInputString" placeholder="01/09/2026-Kru1-001-1001-1500-5" style="padding: 8px; font-size: 11px; border: 1px solid #ccc; border-radius: 4px;">
        <button id="btnExecuteRangeInput" style="background: #007bff; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 11px;">🚀 Update Massal</button>
      </div>
    </div>

    <div class="form-card" style="border-left: 6px solid #28a745;">
      <h3 style="margin-top: 0; font-size: 13px; color: #333;">📍 2. Input Satuan</h3>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
        <select id="adminTargetBlock" style="padding: 7px; font-weight: bold; border-radius: 4px; border: 1px solid #ccc; font-size: 11px;">
          <option value="East_Block">East_Block</option>
          <option value="Central_Block" selected>Central_Block</option>
          <option value="West_Block">West_Block</option>
        </select>
        <input type="text" id="adminInputString" placeholder="01/09/2026-Kru1-001-0011001.0-5" style="padding: 8px; font-size: 11px; border: 1px solid #ccc; border-radius: 4px;">
        <button id="btnExecuteAdminInput" style="background: #28a745; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 11px;">🚀 Rekam Satuan</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://kimzyjcuqbyxmcixojke.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpbXp5amN1cWJ5eG1jaXhvamtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjg5NzcsImV4cCI6MjEwMzg0NDk3N30.dpyM0bPeUExLWR9d0CsIRU7C5B1ZD4EN1VY4eNd_KYc";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.addEventListener("DOMContentLoaded", function() {
    const map = L.map("map", { 
      preferCanvas: true, zoomControl: false, tap: true, touchZoom: true 
    }).setView([-7.15, 111.88], 13);
    
    L.control.zoom({ position: "topleft" }).addTo(map);
  
    const baseOSM = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    const baseSat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 });
  
    const groupSource = L.layerGroup().addTo(map);
    const groupReceiver = L.layerGroup().addTo(map);
    const groupPointLabels = L.layerGroup().addTo(map);

    let loadedLayers = [];
    let allFeatures = [];
    let rawData = { East_Block: null, Central_Block: null, West_Block: null };
    let cloudProgressMap = {};

    const dashboardPage = document.getElementById("dashboard-page");
    const adminPage = document.getElementById("admin-page");
    const uploadPage = document.getElementById("upload-page");

    document.getElementById("btn-open-dashboard").addEventListener("click", () => {
      dashboardPage.style.display = "flex";
      renderChartsAndStats(document.getElementById("dashboardSelectBlock").value);
    });
    document.getElementById("btn-close-dashboard").addEventListener("click", () => dashboardPage.style.display = "none");

    document.getElementById("btn-open-upload").addEventListener("click", () => uploadPage.style.display = "flex");
    document.getElementById("btn-close-upload").addEventListener("click", () => uploadPage.style.display = "none");

    document.getElementById("btn-open-admin").addEventListener("click", () => {
      const pwd = prompt("Masukkan Password Administrator:");
      if (pwd === "admin123") {
        adminPage.style.display = "flex";
      } else if (pwd !== null) {
        alert("Password salah!");
      }
    });
    document.getElementById("btn-close-admin").addEventListener("click", () => adminPage.style.display = "none");

    document.getElementById("mainSelectBlock").addEventListener("change", (e) => renderBlockOnMap(e.target.value));
    document.getElementById("dashboardSelectBlock").addEventListener("change", (e) => renderChartsAndStats(e.target.value));

    async function fetchCloudProgress() {
      try {
        const { data, error } = await supabaseClient.from("progress_seismik").select("*");
        if (error) { console.error("Gagal ambil cloud:", error); return; }
        cloudProgressMap = {};
        if (data) {
          data.forEach(row => {
            cloudProgressMap[`${row.block}_${row.line}_${row.tr}`] = row;
          });
        }
      } catch (err) {
        console.error("Error Koneksi Supabase:", err);
      }
    }

    function applyCloudDataToGeoJSON() {
      ["East_Block", "Central_Block", "West_Block"].forEach(blockName => {
        if (rawData[blockName] && Array.isArray(rawData[blockName].features)) {
          rawData[blockName].features.forEach(f => {
            const p = f.properties || {};
            const key = `${blockName}_${String(p.Line || "").trim()}_${parseFloat(p.Tr)}`;
            if (cloudProgressMap[key]) {
              const cp = cloudProgressMap[key];
              p.Tanggal = cp.tanggal;
              p.Kru = cp.kru;
              p.topo = cp.topo;
              p.rintis = cp.rintis;
              p.bridging = cp.bridging;
              p.drilling = cp.drilling;
              p.recording = cp.recording;
              if (cp.new_x) p.NewX = cp.new_x;
              if (cp.new_y) p.NewY = cp.new_y;
              if (cp.new_z) p.NewZ = cp.new_z;
              if (cp.new_id) p.NEWID = cp.new_id;
            }
          });
        }
      });
    }

    // Fungsi fetch aman yang mencoba berbagai variasi path file sekaligus
    async function loadGeoJsonFile(filename) {
      const possiblePaths = [
        filename,                           // Langsung di root: "East_Block.geojson"
        `./${filename}`,                    // Dengan relative path: "./East_Block.geojson"
        `static/${filename}`,               // Dalam folder static: "static/East_Block.geojson"
        `./static/${filename}`              // "./static/East_Block.geojson"
      ];

      for (let path of possiblePaths) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            const text = await res.text();
            // Pastikan bukan mengembalikan halaman HTML (misal kena 404 custom Vercel)
            if (text.trim().startsWith("{") || text.trim().startsWith("[")) {
              return JSON.parse(text);
            }
          }
        } catch (e) {
          // Lanjut coba path berikutnya
        }
      }
      throw new Error(`File ${filename} tidak ditemukan di semua path yang dicoba.`);
    }

    async function initAppData() {
      await fetchCloudProgress();

      try {
        const [eastData, centData, westData] = await Promise.all([
          loadGeoJsonFile("East_Block.geojson"),
          loadGeoJsonFile("Central_Block.geojson"),
          loadGeoJsonFile("West_Block.geojson")
        ]);

        rawData.East_Block = eastData;
        rawData.Central_Block = centData;
        rawData.West_Block = westData;

        applyCloudDataToGeoJSON();
        renderBlockOnMap(document.getElementById("mainSelectBlock").value);
      } catch (err) {
        console.error("Detail Error GeoJSON:", err);
        alert("⚠️ Gagal memuat file GeoJSON. Pastikan file East_Block.geojson, Central_Block.geojson, dan West_Block.geojson sudah di-upload ke Vercel di direktori yang sama dengan index.html.");
      }
    }

    initAppData();

    let myChart = null;
    function renderChartsAndStats(selectedBlock) {
      let featuresS = [], featuresR = [];
      const blocks = selectedBlock === "ALL" ? ["East_Block", "Central_Block", "West_Block"] : [selectedBlock];
      
      blocks.forEach(b => {
        if (rawData[b] && Array.isArray(rawData[b].features)) {
          rawData[b].features.forEach(f => {
            const desc = String(f.properties?.Desc_ || "").trim().toUpperCase();
            if (desc === "S") featuresS.push(f);
            else if (desc === "R") featuresR.push(f);
          });
        }
      });

      let statS = calculateProgress({ features: featuresS });
      let statR = calculateProgress({ features: featuresR });

      document.getElementById("modal-stats-summary").innerHTML = `
        <div class="stat-card" style="border-left-color: #8b0000;">
          <h4>Total Source (S): ${statS.total} Poin</h4>
          <div style="font-size:10px; color:#555; margin-top:3px;">
            Topo: ${statS.topo} | Rintis: ${statS.rintis} | Bridge: ${statS.bridging} | <b>Drill: ${statS.drilling}</b>
          </div>
        </div>
        <div class="stat-card" style="border-left-color: #0055ff;">
          <h4>Total Receiver (R): ${statR.total} Poin</h4>
          <div style="font-size:10px; color:#555; margin-top:3px;">
            Topo: ${statR.topo} | Rintis: ${statR.rintis} | Bridge: ${statR.bridging} | <b>Rec: ${statR.recording}</b>
          </div>
        </div>
      `;

      const ctx = document.getElementById('progressChart').getContext('2d');
      if (myChart) myChart.destroy();
      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Topo (1)', 'Rintis (2)', 'Bridge (3)', 'Drill (4-S)', 'Rec (5-R)'],
          datasets: [
            { label: 'Source (S)', data: [statS.topo, statS.rintis, statS.bridging, statS.drilling, 0], backgroundColor: '#8b0000' },
            { label: 'Receiver (R)', data: [statR.topo, statR.rintis, statR.bridging, 0, statR.recording], backgroundColor: '#0055ff' }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
      });
    }
  
    L.control.layers(
      { "Peta Jalan": baseOSM, "Satelit": baseSat },
      { "Source (S)": groupSource, "Receiver (R)": groupReceiver, "Label Poin": groupPointLabels },
      { position: "topright" }
    ).addTo(map);
  
    map.pm.addControls({ position: 'topleft', drawMarker: true, drawPolyline: true, drawPolygon: true, editMode: true, removalMode: true });

    function getPointColor(properties, defaultColor) {
      if (String(properties.recording) === "5") return "#00008b"; 
      if (String(properties.drilling) === "4")  return "#8b0000"; 
      if (String(properties.bridging) === "3")  return "#000000"; 
      if (String(properties.rintis) === "2")    return "#28a745"; 
      if (String(properties.topo) === "1")      return "#ffc107"; 
      return defaultColor; 
    }

    function getPointName(p) {
      if (!p) return "";
      return p.NEWID && p.NEWID.trim() !== "" ? p.NEWID : (p.ID || "");
    }
  
    function renderBlockOnMap(selectedBlock) {
      groupSource.clearLayers();
      groupReceiver.clearLayers();
      loadedLayers = [];
      allFeatures = [];
  
      let featuresS = [], featuresR = [];
      const blocks = selectedBlock === "ALL" ? ["East_Block", "Central_Block", "West_Block"] : [selectedBlock];
      
      blocks.forEach(b => {
        if (rawData[b] && Array.isArray(rawData[b].features)) {
          rawData[b].features.forEach(f => {
            const desc = String(f.properties?.Desc_ || "").trim().toUpperCase();
            if (desc === "S") featuresS.push(f);
            else if (desc === "R") featuresR.push(f);
            allFeatures.push(f);
          });
        }
      });
  
      let bounds = L.latLngBounds([]);

      if (featuresS.length > 0) {
        const layerS = L.geoJSON({ type: "FeatureCollection", features: featuresS }, {
          pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 3, fillColor: getPointColor(f.properties || {}, "#8b0000"), stroke: false, fillOpacity: 0.85 }),
          onEachFeature: (f, l) => { bindPopup(f, l); groupSource.addLayer(l); }
        });
        loadedLayers.push(layerS);
        bounds.extend(layerS.getBounds());
      }
  
      if (featuresR.length > 0) {
        const layerR = L.geoJSON({ type: "FeatureCollection", features: featuresR }, {
          pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 3, fillColor: getPointColor(f.properties || {}, "#0055ff"), stroke: false, fillOpacity: 0.85 }),
          onEachFeature: (f, l) => { bindPopup(f, l); groupReceiver.addLayer(l); }
        });
        loadedLayers.push(layerR);
        bounds.extend(layerR.getBounds());
      }
  
      if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });
      updatePointLabels();
    }
  
    const MIN_ZOOM_FOR_LABELS = 16;
    function updatePointLabels() {
      groupPointLabels.clearLayers();
      if (map.getZoom() >= MIN_ZOOM_FOR_LABELS) {
        const bounds = map.getBounds();
        allFeatures.forEach(f => {
          if (f.geometry && f.geometry.coordinates) {
            const latlng = L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]);
            if (bounds.contains(latlng)) {
              const labelText = getPointName(f.properties);
              if (labelText) {
                L.marker(latlng, { icon: L.divIcon({ className: 'point-name-label', html: labelText, iconSize: null }) }).addTo(groupPointLabels);
              }
            }
          }
        });
      }
    }
    map.on("zoomend moveend", updatePointLabels);
  
    function calculateProgress(geojson) {
      let s = { total: geojson.features.length, topo: 0, rintis: 0, bridging: 0, drilling: 0, recording: 0 };
      geojson.features.forEach(f => {
        const p = f.properties || {};
        if (String(p.topo) === "1") s.topo++;
        if (String(p.rintis) === "2") s.rintis++;
        if (String(p.bridging) === "3") s.bridging++;
        if (String(p.drilling) === "4") s.drilling++;
        if (String(p.recording) === "5") s.recording++;
      });
      return s;
    }
  
    function bindPopup(feature, layer) {
      const p = feature.properties || {};
      const pointName = getPointName(p) || p.ID || "Poin";
      const infoKru = p.Kru && p.Kru.trim() !== "" ? `${p.Kru} (${p.Tanggal})` : '- Belum ada data -';

      layer.bindPopup(`
        <div style="font-size:11px; font-family:sans-serif;">
          <b style="color:#007bff; font-size:12px;">ID: ${pointName}</b> (${p.Desc_ || 'R'})<br>
          <b>Line:</b> ${p.Line || '-'} | <b>Tr:</b> ${p.Tr || '-'}<br>
          <b>Pelaksana:</b> <span style="color: #28a745; font-weight: bold;">${infoKru}</span><br>
          <hr style="margin:3px 0">
          <b>Status:</b> Topo(${p.topo||0}) | Rintis(${p.rintis||0}) | Bridge(${p.bridging||0}) | Drill(${p.drilling||0}) | Rec(${p.recording||0})
        </div>
      `);
    }

    async function saveProgressToCloud(recordsArray) {
      const { error } = await supabaseClient.from("progress_seismik").upsert(recordsArray, { onConflict: 'block,line,tr' });
      if (error) {
        alert("⚠️ Gagal sync ke Cloud: " + error.message);
        return false;
      }
      return true;
    }

    document.getElementById("btnExecuteUploadFile").addEventListener("click", async () => {
      const fileInput = document.getElementById("fileReportInput");
      const targetBlock = document.getElementById("uploadTargetBlock").value;
      if (fileInput.files.length === 0) { alert("Pilih file terlebih dahulu!"); return; }

      const reader = new FileReader();
      reader.readAsText(fileInput.files[0]);
      reader.onload = async function(e) {
        const lines = e.target.result.split(/\r\n|\n/);
        let cloudBatch = [];

        lines.forEach(lineStr => {
          const cleanLine = lineStr.trim();
          if (!cleanLine || cleanLine.startsWith("#")) return;
          const parts = cleanLine.split(/,|\t|;/).map(item => item.trim());
          if (parts.length < 6) return;

          const [tgl, kru, targetLine, trAwal, trAkhir, statusCode] = [parts[0], parts[1], parts[2], parseFloat(parts[3]), parseFloat(parts[4]), parts[5]];
          const blocksToSearch = targetBlock === "ALL" ? ["East_Block", "Central_Block", "West_Block"] : [targetBlock];

          blocksToSearch.forEach(b => {
            const blockData = rawData[b];
            if (blockData && Array.isArray(blockData.features)) {
              blockData.features.forEach(f => {
                const p = f.properties || {};
                if (String(p.Line || "").trim() === targetLine && parseFloat(p.Tr) >= trAwal && parseFloat(p.Tr) <= trAkhir) {
                  p.Tanggal = tgl; p.Kru = kru;
                  p.topo = (statusCode >= "1") ? "1" : "0";
                  p.rintis = (statusCode >= "2") ? "2" : "0";
                  p.bridging = (statusCode >= "3") ? "3" : "0";
                  p.drilling = (statusCode === "4") ? "4" : "0";
                  p.recording = (statusCode === "5") ? "5" : "0";

                  cloudBatch.push({ block: b, line: String(p.Line || "").trim(), tr: parseFloat(p.Tr), tanggal: tgl, kru, topo: p.topo, rintis: p.rintis, bridging: p.bridging, drilling: p.drilling, recording: p.recording });
                }
              });
            }
          });
        });

        if (cloudBatch.length > 0 && await saveProgressToCloud(cloudBatch)) {
          alert(`✅ Berhasil sync ${cloudBatch.length} titik!`);
          uploadPage.style.display = "none";
          renderBlockOnMap(document.getElementById("mainSelectBlock").value);
        }
      };
    });

    document.getElementById("btnExecuteRangeInput").addEventListener("click", async () => {
      const targetBlock = document.getElementById("adminRangeTargetBlock").value;
      const rawInput = document.getElementById("adminRangeInputString").value.trim();
      const parts = rawInput.split("-");
      if (parts.length < 6) { alert("Format salah!"); return; }

      const [tgl, kru, targetLine, trAwal, trAkhir, statusCode] = [parts[0].trim(), parts[1].trim(), parts[2].trim(), parseFloat(parts[3]), parseFloat(parts[4]), parts[5].trim()];
      let cloudBatch = [];
      const blockData = rawData[targetBlock];

      if (blockData && Array.isArray(blockData.features)) {
        blockData.features.forEach(f => {
          const p = f.properties || {};
          if (String(p.Line || "").trim() === targetLine && parseFloat(p.Tr) >= trAwal && parseFloat(p.Tr) <= trAkhir) {
            p.Tanggal = tgl; p.Kru = kru;
            p.topo = (statusCode >= "1") ? "1" : "0";
            p.rintis = (statusCode >= "2") ? "2" : "0";
            p.bridging = (statusCode >= "3") ? "3" : "0";
            p.drilling = (statusCode === "4") ? "4" : "0";
            p.recording = (statusCode === "5") ? "5" : "0";
            cloudBatch.push({ block: targetBlock, line: String(p.Line || "").trim(), tr: parseFloat(p.Tr), tanggal: tgl, kru, topo: p.topo, rintis: p.rintis, bridging: p.bridging, drilling: p.drilling, recording: p.recording });
          }
        });
      }

      if (cloudBatch.length > 0 && await saveProgressToCloud(cloudBatch)) {
        alert(`✅ Update massal sukses!`);
        document.getElementById("adminRangeInputString").value = "";
        adminPage.style.display = "none";
        renderBlockOnMap(document.getElementById("mainSelectBlock").value);
      }
    });

    document.getElementById("btnExecuteAdminInput").addEventListener("click", async () => {
      const targetBlock = document.getElementById("adminTargetBlock").value;
      const rawInput = document.getElementById("adminInputString").value.trim();
      const parts = rawInput.split("-");
      if (parts.length < 5) { alert("Format salah!"); return; }

      const [tgl, kru, targetLine, targetId, statusCode] = [parts[0].trim(), parts[1].trim(), parts[2].trim(), parts[3].trim(), parts[4].trim()];
      let targetFeature = null;
      const blockData = rawData[targetBlock];

      if (blockData && Array.isArray(blockData.features)) {
        blockData.features.forEach(f => {
          const p = f.properties || {};
          if (String(p.Line || "").trim() === targetLine && String(p.ID || "").trim() === targetId) targetFeature = f;
        });
      }

      if (targetFeature) {
        const p = targetFeature.properties;
        p.Tanggal = tgl; p.Kru = kru;
        p.topo = (statusCode >= "1") ? "1" : "0";
        p.rintis = (statusCode >= "2") ? "2" : "0";
        p.bridging = (statusCode >= "3") ? "3" : "0";
        p.drilling = (statusCode === "4") ? "4" : "0";
        p.recording = (statusCode === "5") ? "5" : "0";

        let rowData = { block: targetBlock, line: String(p.Line || "").trim(), tr: parseFloat(p.Tr), tanggal: tgl, kru, topo: p.topo, rintis: p.rintis, bridging: p.bridging, drilling: p.drilling, recording: p.recording };
        if (parts.length >= 9) {
          p.NewX = parseFloat(parts[5]); p.NewY = parseFloat(parts[6]); p.NewZ = parseFloat(parts[7]); p.NEWID = parts[8].trim();
          Object.assign(rowData, { new_x: p.NewX, new_y: p.NewY, new_z: p.NewZ, new_id: p.NEWID });
        }

        if (await saveProgressToCloud([rowData])) {
          alert(`✅ Rekam data sukses!`);
          document.getElementById("adminInputString").value = "";
          adminPage.style.display = "none";
          renderBlockOnMap(document.getElementById("mainSelectBlock").value);
        }
      } else {
        alert("ID Stasiun tidak ditemukan.");
      }
    });

    document.getElementById("btn-export-geojson").addEventListener("click", () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ type: "FeatureCollection", features: allFeatures }, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `Progress_Seismik_${new Date().toISOString().slice(0,10)}.geojson`);
      document.body.appendChild(a); a.click(); a.remove();
    });

    const searchInput = document.getElementById("searchBox");
    searchInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) return;
        let found = false;
        loadedLayers.forEach(gl => {
          gl.eachLayer(layer => {
            const p = layer.feature.properties || {};
            if (String(p.ID || "").trim().toLowerCase() === query || String(p.NEWID || "").trim().toLowerCase() === query) {
              map.setView(layer.getLatLng(), 18);
              layer.openPopup();
              found = true;
            }
          });
        });
        if (!found) alert("ID Poin tidak ditemukan!");
        searchInput.blur();
      }
    });

    map.on("mousemove", function(e) {
      document.getElementById("coord-info").innerHTML = `Lat: ${e.latlng.lat.toFixed(5)}, Lon: ${e.latlng.lng.toFixed(5)}`;
    });
  });
</script>
</body>
</html>
